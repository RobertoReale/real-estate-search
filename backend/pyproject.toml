# Dev-only tooling config (ruff, pyright). The runtime never reads this file; it
# exists so `ruff`, `pyright` and coverage share one source of truth. Line length
# tracks the existing hand-written code rather than imposing a narrower wrap
# after the fact.

# Not a distributable package — nothing here is ever built or published. The
# [project] table exists so `requires-python` has the home the standard defines,
# where uv reads it when resolving the locks and the start scripts check it
# before building a venv. The upper bound is honest rather than pessimistic: it
# says "no version beyond this has been tested", and it is what turns an
# unsupported interpreter into one clear message instead of a missing-wheel
# traceback halfway through installing.
[project]
name = "real-estate-search-backend"
# Kept in step with frontend/package.json and with the release tags: the two
# halves ship as one thing, so two different numbers would only ever be a
# question nobody can answer.
version = "1.1.0"
requires-python = ">=3.11,<3.15"

# Pyright resolves the interpreter from PATH unless told otherwise, and on a
# machine where `python` is the system install that means every third-party
# import fails to resolve — 100 phantom errors that hide the two or three real
# ones. Pinning the venv here is what makes the documented `cd backend &&
# pyright` behave the same on any machine, including CI.
[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (dead imports, unused vars), I import order,
# B bug-bear (mutable defaults, etc.), UP pyupgrade. E501 is left to the
# formatter, which owns wrapping.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length: the formatter owns wrapping
    "B008",  # call in default arg: FastAPI's Depends()/Query() pattern is idiomatic, not a bug
    "E741",  # ambiguous single-char names: renaming existing loop vars is risky churn for a style nit
    "B009",  # getattr(x, "const"): used deliberately to read a dynamic attr pyright can't see
    "B010",  # setattr(x, "const", v): used deliberately to assign to a typed attr (test fakes) without a pyright error
]

[tool.coverage.run]
source = ["app"]
omit = ["alembic/*", "tests/*"]
