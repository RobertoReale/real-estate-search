# Runs the same gates a developer runs, on both operating systems this project
# is used on: Windows (the daily driver) and Linux (the Raspberry Pi target).
#
# It installs from the lockfiles rather than resolving fresh, so it also proves
# the locks are installable — which is the whole point of Phase 0. The test
# suite is offline by construction (simulated HTML, fake IMAP client, in-memory
# SQLite), so no step here ever reaches a portal: CI must never become a source
# of DataDome blocks against the addresses the real scans depend on. That holds
# for the weekly run below, which repeats these same jobs and adds no step of
# its own — a schedule is the one trigger that could quietly turn CI into
# recurring traffic against a portal, and this one does not.
name: CI

on:
  push:
  pull_request:
  # Weekly, because the failures worth catching here produce no push: a yanked
  # dependency, a rebuilt runner image, an action version that stopped
  # resolving. Without this they surface the next time someone needs the project
  # to work; with it they surface on a dated red mark instead.
  #
  # Off the hour on purpose — the top of the hour is when everyone else's cron
  # fires, and a run queued behind that backlog starts late enough to stop
  # reading as weekly.
  #
  # GitHub disables a scheduled workflow after 60 days of no repository activity
  # and mails the owner when it does. That is exactly the silence this trigger
  # exists to break, so the mail is the signal, not noise: re-enable it.
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC

# A second push to the same branch makes the first run irrelevant. The event
# name is part of the group so the weekly run and a push to the default branch,
# which share a ref, cannot cancel each other: the push's verdict is the one
# attached to a commit somebody is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv_bin: bin
          - os: windows-latest
            venv_bin: Scripts

    # Every step speaks bash, including on the Windows runner: one spelling of
    # each command instead of a PowerShell variant that drifts from it.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The version the README recommends, inside the requires-python range
          # pyproject.toml declares.
          python-version: "3.12"

      # A real venv at backend/.venv, exactly like a developer's checkout.
      # pyright's [tool.pyright] pins venvPath/venv there, so building it here
      # is what makes the type check resolve the same packages it does locally.
      - name: Create the virtual environment
        run: python -m venv backend/.venv

      - name: Install from the lockfile
        working-directory: backend
        # --require-hashes is technically redundant — every pinned line carries
        # hashes, which already puts pip in hash-checking mode — but it turns a
        # future edit that drops one into a loud failure instead of a silent
        # downgrade to ordinary resolution.
        run: .venv/${{ matrix.venv_bin }}/python -m pip install --require-hashes -r requirements-dev.txt

      - name: Tests
        working-directory: backend
        # Playwright and camoufox are deliberately absent (invariant 18), so one
        # test skips here. That is the supported configuration, not a gap: the
        # gate is green with no optional browser stack installed.
        run: .venv/${{ matrix.venv_bin }}/python -m pytest tests -q

      - name: Lint
        working-directory: backend
        # `python -m ruff`, not the console script: the venv installs ruff.exe on
        # Windows and ruff on Linux, and the module form spells the same on both.
        run: |
          .venv/${{ matrix.venv_bin }}/python -m ruff check app tests
          .venv/${{ matrix.venv_bin }}/python -m ruff format --check app tests

      - name: Install pyright
        # Pinned to the version this was verified against: an unpinned global
        # install turns a new pyright release into a red build on a commit that
        # changed nothing.
        run: npm install -g pyright@1.1.410

      - name: Type check
        working-directory: backend
        run: pyright

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the development machine, and therefore the npm that writes
          # package-lock.json. The first CI run failed here: a lock written by
          # npm 11 was rejected by the npm 10 that ships with Node 22, so the
          # two must not drift. (Vite 7 needs ^20.19 || >=22.12 regardless.)
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci`, not `install`: it installs exactly what the lock pins and fails
      # when the lock and package.json disagree, where `install` would rewrite
      # the lock and hand this runner a toolchain of its own.
      - name: Install from the lockfile
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Tests
        working-directory: frontend
        run: npm test

  # frontend/src/types/api.ts is generated from the backend's OpenAPI document
  # and committed, so the browser builds without a backend running. Committed
  # means it can go stale, and a stale wire type is the exact failure this whole
  # arrangement exists to remove: a field renamed in schemas.py would otherwise
  # be a silent `undefined` in production with every other gate green. So the
  # file is regenerated here and compared. `git diff --exit-code` is the gate —
  # if regenerating changes anything, the commit did not run the generator.
  api-types:
    name: generated API types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The runtime dependencies only: this builds the OpenAPI document by
      # importing the app, which needs no dev tooling.
      - name: Create the virtual environment
        run: python -m venv backend/.venv

      - name: Install the backend from the lockfile
        working-directory: backend
        run: .venv/bin/python -m pip install --require-hashes -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/apitypes/package-lock.json

      # openapi-typescript, in its own tree. It links against the TypeScript
      # compiler API and pins that peer to 5.x, while the app is built with
      # TypeScript 7 — installed beside the frontend it loads the app's compiler
      # and dies, so it gets a node_modules of its own.
      - name: Install the generator from its lockfile
        working-directory: scripts/apitypes
        run: npm ci

      - name: Regenerate
        run: backend/.venv/bin/python scripts/gen_api_types.py

      - name: The committed types match the backend
        run: git diff --exit-code -- frontend/src/types/api.ts

  # The browser suite (frontend/playwright.config.ts). It needs both toolchains
  # in one job — the harness starts the real backend against a throwaway
  # database seeded with the demo corpus, then serves the production build at
  # it — which is why it is not a step inside `frontend` above.
  #
  # Linux only: the suite drives Chromium against an app with no
  # platform-specific code, so a second runner would double the minutes to
  # re-prove the same thing. It reaches no network by construction (the offline
  # guard in e2e/harness/offline.ts fails the run on an attempt), so this job
  # never becomes traffic against a portal.
  # A gate now, where it started as advisory. It was let through while its first
  # journeys were written against defects the audit had already found and that
  # had not been fixed yet — a red run then was the expected result rather than
  # news. Those are closed, so from here a failure here means something broke.
  # Two of them nothing else in this workflow can see: a screen that scrolls
  # sideways or fails an axe-core check at 390, 768 or 1440 px, and an
  # interactive control added without an entry in frontend/e2e/actions.ts.
  e2e:
    name: browser suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The runtime dependencies only: the harness runs the application, it does
      # not lint or type-check it, and serve-backend.mjs picks this venv up by
      # path the same way a developer's checkout does.
      - name: Create the virtual environment
        run: python -m venv backend/.venv

      - name: Install the backend from the lockfile
        working-directory: backend
        run: .venv/bin/python -m pip install --require-hashes -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        working-directory: frontend
        run: npm ci

      # `--with-deps` because a bare runner has none of the shared libraries
      # Chromium links against, and the failure without them is a launch error
      # that reads like a bug in the suite.
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser suite
        working-directory: frontend
        run: npm run e2e

      # The report is how a failure here is diagnosed without reproducing it:
      # it carries the trace, the screenshot and the network log of every failed
      # test.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
